<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dawn gradient: night → sunrise coral → morning amber. Neutral
         across habits while carrying the "breaking into a new day"
         metaphor that matches the app name. -->
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="50%"  stop-color="#F06B4D"/>
      <stop offset="100%" stop-color="#F5A523"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF6E3"/>
    </linearGradient>
    <!-- Soft glow behind the broken ring -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft halo behind ring -->
  <circle cx="256" cy="256" r="170" fill="url(#glow)"/>

  <!-- Broken ring: near-complete arc from 1 o'clock clockwise through
       bottom to 11 o'clock, leaving a gap at top — "the habit,
       broken." -->
  <path d="M 320 145 A 128 128 0 1 1 192 145"
        stroke="url(#ring)"
        stroke-width="44"
        stroke-linecap="round"
        fill="none"/>

  <!-- Ascending sparkles in the gap, suggesting release / rising dawn -->
  <circle cx="256" cy="118" r="14" fill="#FFFFFF"/>
  <circle cx="214" cy="93"  r="8"  fill="#FFFFFF" opacity="0.85"/>
  <circle cx="298" cy="96"  r="7"  fill="#FFFFFF" opacity="0.75"/>
  <circle cx="240" cy="72"  r="5"  fill="#FFFFFF" opacity="0.6"/>
  <circle cx="278" cy="68"  r="4"  fill="#FFFFFF" opacity="0.5"/>
</svg>
